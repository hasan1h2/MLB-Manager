name: mlb_manager
description: "My Life & Business Manager - Complete Offline-First Financial & Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  get: ^4.6.6

  # Database & ORM
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1

  # UI & Charts
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  responsive_framework: ^1.5.1

  # Storage & Pickers
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.1.7
  image_picker: ^1.1.2

  # Documents & Exports
  pdf: ^3.11.2
  printing: ^5.13.3
  excel: ^4.0.6
  csv: ^6.0.0
  archive: ^3.6.1

  # AI & Hardware Integration
  speech_to_text: ^7.0.0
  google_mlkit_text_recognition: ^0.14.0
  flutter_local_notifications: ^18.0.1
  local_auth: ^2.3.0
  cryptography: ^2.7.2
  crypto: ^3.0.6
  device_preview: ^1.3.1
  drift_flutter: ^0.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.28.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0A1926"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/